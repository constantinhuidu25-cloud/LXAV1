[build]
publish = "./"
functions = "functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]
  node_bundler = "esbuild"

  [functions.drolly-account]
    included_files = ["functions/firebase-storage.js"]

  # Scheduled functions: Netlify calls these on the cron below, no external
  # pinger needed. Both just hit drolly-account.js internally, so they need
  # the process.env.URL that Netlify injects at runtime, not a hardcoded host.
  [functions.keep-alive]
    schedule = "*/10 * * * *"

  [functions.lxa-player]
    schedule = "*/15 * * * *"

[[headers]]
for = "/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.firebasedatabase.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# SECURITY: publish = "." serves the whole repo root as static files. These
# redirects block direct requests to files/folders that must never be
# public: the Firebase service-account key (if it's ever present on disk
# again), local dev data with real password hashes, function source (bot
# passwords, security logic), and anything else config-like. status = 404
# means Netlify returns a plain 404 instead of the actual file content.
# This is a safety net, not a substitute for keeping secrets out of the
# publish tree entirely — prefer deleting/relocating the actual files.
# NOTE: Netlify redirects only support "*" as a tail-match on the final path
# segment, not as a mid-string wildcard — "/*firebase-adminsdk*.json" and
# "/*service-account*.json" never actually matched anything. Blocking every
# root-level .json is the only pattern Netlify's matcher actually honors, so
# any credential file dropped in root (by mistake) is covered too.
[[redirects]]
from = "/*.json"
to = "/404.html"
status = 404

[[redirects]]
from = "/data/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/.local-data/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/functions/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/package.json"
to = "/404.html"
status = 404

[[redirects]]
from = "/package-lock.json"
to = "/404.html"
status = 404

[[redirects]]
from = "/*.test.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/local-server.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/bot-player.js"
to = "/404.html"
status = 404

# Not referenced anywhere in the running app (audit tooling used during dev
# sessions only) but publish = "." would otherwise serve them publicly.
[[redirects]]
from = "/audit-simulations.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/deployment-check.js"
to = "/404.html"
status = 404

# Old session artefacts (dev-only reports, editor backups, snapshot folders,
# build tooling) that publish = "./" would otherwise serve publicly. None of
# these are referenced by the running app.
[[redirects]]
from = "/*.md"
to = "/404.html"
status = 404

[[redirects]]
from = "/*.bak"
to = "/404.html"
status = 404

[[redirects]]
from = "/backup-v200-20260927-0144/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/backup-v200-20260927-0144-copy2/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/node_modules/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/api/drolly/*"
to = "/.netlify/functions/drolly-account/:splat"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]